server {
    if ($host = comprasawsn8nflujos.zapto.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name comprasawsn8nflujos.zapto.org;
    return 301 https://$host$request_uri;


}

server {
    listen 443 ssl;
    server_name comprasawsn8nflujos.zapto.org;
    ssl_certificate /etc/letsencrypt/live/comprasawsn8nflujos.zapto.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/comprasawsn8nflujos.zapto.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ===========================
    # n8n principal (/)
    # ===========================
    location / {
        proxy_pass http://localhost:5678/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===========================
    # n8n PPT (/ppt/)
    # ===========================
    location /ppt/ {
        proxy_pass http://localhost:5688/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # remove `/ppt/` prefix before forwarding
        rewrite ^/ppt/(.*)$ /$1 break;
    }

    # ===========================
    # n8n IMG (/img/)
    # ===========================
    location /img/ {
        proxy_pass http://localhost:5689/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # remove `/img/` prefix before forwarding
        rewrite ^/img/(.*)$ /$1 break;
    }

    # ===========================
    # n8n Videos (/videos/)
    # ===========================
    location /videos/ {
        proxy_pass http://localhost:5690/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # remove `/videos/` prefix before forwarding
        rewrite ^/videos/(.*)$ /$1 break;
    }


}